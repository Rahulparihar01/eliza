# =============================================================================
# Frontend Nginx Configuration
# =============================================================================
# API Routing Strategy: Relative URLs
# ------------------------------------
# The React frontend uses relative URLs (/v1/...) for all API calls.
# This nginx config proxies /v1/* requests to the backend service (app:5001).
# Benefits:
#   - ONE frontend image works for ALL customers
#   - No API URL baked into the JavaScript bundle
#   - Customer isolation via separate Northflank projects
#
# See: docs/CICD_GHCR_SETUP.md for full documentation
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Allow larger file uploads (up to 50MB)
    client_max_body_size 50M;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # MCP gateway (OAuth + Streamable HTTP + SSE transports)
    # Must be before the SPA catch-all so /mcp/* reaches the backend
    location /mcp/ {
        proxy_pass http://app:5001;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_connect_timeout 75s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Buffering 'no';
        proxy_cache_bypass $http_upgrade;
    }

    # Exact /mcp match (no trailing slash) — same backend
    location = /mcp {
        proxy_pass http://app:5001;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE (Server-Sent Events) for telemetry streaming
    # Must be before general /v1/ location to take precedence
    location ~* ^/v1/bi/questions/.*/telemetry {
        proxy_pass http://app:5001;
        proxy_http_version 1.1;
        
        # Essential for SSE - disable buffering
        proxy_buffering off;
        proxy_cache off;
        
        # Chunked transfer encoding
        chunked_transfer_encoding on;
        
        # Keep connection alive
        proxy_read_timeout 3600s;
        proxy_connect_timeout 75s;
        
        # Headers
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE-specific headers
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header X-Accel-Buffering 'no';
    }

    # API proxy to backend (/v1/ prefix)
    location /v1/ {
        proxy_pass http://app:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API proxy to backend (/api/ prefix - legacy routes)
    location /api/ {
        proxy_pass http://app:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
