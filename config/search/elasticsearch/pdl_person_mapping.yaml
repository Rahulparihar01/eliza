# Elasticsearch mapping for PDL Person data
# Optimized for skills matching, career path analysis, and look-alike candidate search

index_name: pdl_persons
index_prefix: ${CUSTOMER_ID}  # Multi-tenant support

settings:
  number_of_shards: 2
  number_of_replicas: 1
  max_result_window: 10000
  
  analysis:
    analyzer:
      skill_analyzer:
        type: custom
        tokenizer: standard
        filter:
          - lowercase
          - asciifolding
          - skill_synonyms
      
      name_analyzer:
        type: custom
        tokenizer: standard
        filter:
          - lowercase
          - asciifolding
      
      text_analyzer:
        type: custom
        tokenizer: standard
        filter:
          - lowercase
          - asciifolding
          - english_stop
    
    filter:
      skill_synonyms:
        type: synonym
        synonyms:
          - "js, javascript"
          - "py, python"
          - "k8s, kubernetes"
          - "aws, amazon web services"
          - "gcp, google cloud platform"
          - "ml, machine learning"
          - "ai, artificial intelligence"
      
      english_stop:
        type: stop
        stopwords: "_english_"

# Field mappings: source_field → elasticsearch_field
field_mappings:
  # Identity fields
  pdl_id:
    type: keyword
    source: pdl_id
  
  customer_id:
    type: keyword
    source: customer_id
  
  # Name fields
  full_name:
    type: text
    source: full_name
    analyzer: name_analyzer
    fields:
      keyword:
        type: keyword
      suggest:
        type: completion
        analyzer: name_analyzer
  
  first_name:
    type: text
    source: first_name
    analyzer: name_analyzer
    fields:
      keyword:
        type: keyword
  
  last_name:
    type: text
    source: last_name
    analyzer: name_analyzer
    fields:
      keyword:
        type: keyword
  
  # Job fields
  job_title:
    type: text
    source: job_title
    analyzer: text_analyzer
    fields:
      keyword:
        type: keyword
      suggest:
        type: completion
  
  job_title_role:
    type: keyword
    source: job_title_role
  
  job_title_levels:
    type: keyword
    source: job_title_levels
  
  # Company fields
  job_company_name:
    type: text
    source: job_company_name
    fields:
      keyword:
        type: keyword
      suggest:
        type: completion
  
  job_company_size:
    type: keyword
    source: job_company_size
  
  job_company_industry:
    type: keyword
    source: job_company_industry
  
  job_company_location_name:
    type: text
    source: job_company_location_name
    fields:
      keyword:
        type: keyword
  
  # Skills (array)
  skills:
    type: text
    source: skills
    analyzer: skill_analyzer
    fields:
      keyword:
        type: keyword
  
  # Location fields
  location_name:
    type: text
    source: location_name
    fields:
      keyword:
        type: keyword
  
  location_country:
    type: keyword
    source: location_country
  
  location_region:
    type: keyword
    source: location_region
  
  location_metro:
    type: keyword
    source: location_metro
  
  location_locality:
    type: keyword
    source: location_locality
  
  # Experience
  inferred_years_experience:
    type: integer
    source: inferred_years_experience
  
  # Quality score
  pdl_likelihood:
    type: float
    source: pdl_likelihood
  
  # Contact (for reference)
  primary_email:
    type: keyword
    source: primary_email
    index: false
  
  linkedin_url:
    type: keyword
    source: linkedin_url
    index: false
  
  # Timestamps
  created_at:
    type: date
    source: created_at
  
  updated_at:
    type: date
    source: updated_at

# Transformation pipeline
transformers:
  - name: flatten_nested_fields
    apply_to:
      - education_history
      - work_history
  
  - name: extract_keywords
    apply_to:
      - job_title
      - skills

# Search configuration
search_config:
  default_fields:
    - full_name^3
    - job_title^2
    - skills^2
    - job_company_name
    - location_name
  
  boost:
    exact_match: 5.0
    fuzzy_match: 1.0
    partial_match: 0.5

