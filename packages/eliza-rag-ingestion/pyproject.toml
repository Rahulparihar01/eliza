[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eliza-rag-ingestion"
version = "0.1.0"
description = "Portable RAG ingestion and retrieval modules for Eliza Platform"
readme = { text = "Portable RAG ingestion and retrieval modules for Eliza Platform.", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "elasticsearch==8.17.0",
    "httpx>=0.25.0",
    "litellm>=1.80.0",
    "openai==1.109.0",
    "pydantic>=2.6.1,<3.0.0",
    "PyMuPDF>=1.24.0",
    "PyPDF2==3.0.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.0",
    "requests>=2.31.0",
    "requests-aws4auth>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "docling==2.55.1",
    "docling-core>=2.0.0,<3.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
