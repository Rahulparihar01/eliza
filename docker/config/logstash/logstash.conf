input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse timestamp if present
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add service metadata
  mutate {
    add_field => {
      "service" => "ai-platform"
      "[@metadata][index]" => "ai-platform-logs"
    }
  }

  # Convert duration to float if present
  if [duration_ms] {
    mutate {
      convert => { "duration_ms" => "float" }
    }
  }

  # Tag slow requests
  if [duration_ms] and [duration_ms] > 1000 {
    mutate {
      add_tag => ["slow_request"]
    }
  }

  # Tag errors
  if [level] == "ERROR" or [level] == "CRITICAL" {
    mutate {
      add_tag => ["error"]
    }
  }

  # Extract context fields for easier querying
  if [context] {
    if [context][request_id] {
      mutate {
        add_field => { "request_id" => "%{[context][request_id]}" }
      }
    }
    if [context][user_id] {
      mutate {
        add_field => { "user_id" => "%{[context][user_id]}" }
      }
    }
    if [context][task_id] {
      mutate {
        add_field => { "task_id" => "%{[context][task_id]}" }
      }
    }
    if [context][document_id] {
      mutate {
        add_field => { "document_id" => "%{[context][document_id]}" }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ai-platform-logs-%{+YYYY.MM.dd}"
    
    # Disable ILM for local development to avoid missing policy errors
    ilm_enabled => false
  }

  # Debug output (optional - can be removed in production)
  stdout {
    codec => rubydebug
  }
}

