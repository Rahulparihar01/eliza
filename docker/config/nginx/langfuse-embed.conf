server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://langfuse-web:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Langfuse blocks iframe embedding by default. We intentionally strip
        # frame restrictions for the internal telemetry embed proxy.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:3000 http://127.0.0.1:3000" always;
    }
}
