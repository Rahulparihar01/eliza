      - BEDROCK_EMBEDDING_REGION=${BEDROCK_EMBEDDING_REGION:-us-east-1}
      # OpenSearch
      - RAG_OPENSEARCH_HOST=${RAG_OPENSEARCH_HOST:-}
      - RAG_OPENSEARCH_REGION=${RAG_OPENSEARCH_REGION:-us-east-1}
      - RAG_OPENSEARCH_INDEX_PREFIX=${RAG_OPENSEARCH_INDEX_PREFIX:-rag_domains}
    volumes:
      - ../dags:/opt/airflow/dags
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - ai-platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

