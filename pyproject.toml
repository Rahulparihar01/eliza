[project]
name = "ElizaPlatform"
version = "0.1.0"
description = "Dependencies for Eliza Platform"
readme = "README.md"
requires-python = ">=3.12"

# Dependencies are managed via uv. Update with `uv add` / `uv remove`.
dependencies = [
    # Core web
    "fastapi>=0.104.0",
    "mcp>=1.19.0",
    "starlette>=0.27.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "aiohttp>=3.9.0",
    # Database and ORM
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    # Redis and task queue
    "redis>=5.0.1",
    "celery[redis]>=5.3.4",
    # Search and graph
    "elasticsearch==8.17.0",
    "neo4j>=5.14.1",
    # AI providers and orchestration
    "openai==1.109.0",
    "anthropic<1,>=0.40",
    "litellm>=1.80.0",
    "eliza-rag-ingestion",
    "pydantic-ai",
    "dspy",
    "langfuse",
    "boto3==1.40.49",
    "botocore==1.40.49",
    "crewai==1.5.0",
    "vanna==0.7.9",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "spacy==3.8.7",
    # Document processing
    "docling==2.55.1",
    "docling-core>=2.0.0,<3.0.0",
    "PyMuPDF>=1.24.0",
    "docx2txt>=0.8",
    "PyPDF2==3.0.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.0",
    "filetype==1.2.0",
    "pypdfium2",
    "fpdf",
    # Auth and security
    "bcrypt>=4.0.0",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.8.0",
    "cryptography",
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
    "Pillow>=10.0.1",
    "email-validator>=2.1.0",
    # Configuration
    "pydantic>=2.6.1,<3.0.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "python-dateutil>=2.8.0",
    # HTTP and utilities
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "requests-aws4auth",
    "cachetools>=5.3.2",
    "structlog>=23.2.0",
    "python-logstash>=0.4.8",
    "psutil>=5.9.0",
    "sseclient-py>=1.8.0",
    "websockets>=12.0",
    "twilio",
    # Data and ML tools
    "datasets",
    "huggingface-hub",
    # Testing and scripts
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "responses",
    "faker",
    # Celery monitoring
    "flower>=2.0.1",
    # PyTorch CPU-only (explicit to override transitive CUDA deps from docling/easyocr)
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pymupdf>=1.27.1",
    "faiss-cpu>=1.13.2",
    "celery-redbeat>=2.3.3",
    "signxml>=4.4.0",
]

[tool.uv]
# Use CPU-only PyTorch to avoid downloading ~5GB of NVIDIA CUDA libraries
# This is critical for CI builds (GitHub Actions runners run out of memory/disk)
# and for production (we don't have GPUs on Northflank)
# Ensure uv lock resolves wheels for all target platforms
# (local macOS ARM, CI/production Linux x86_64, local Docker Linux ARM)
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# CPU index for ALL platforms (per uv PyTorch docs)
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]
"eliza-rag-ingestion" = { path = "packages/eliza-rag-ingestion" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B905",   # zip without explicit strict parameter
    "UP007",  # use X | Y for type annotations (not compatible with Python 3.9)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["ARG", "S101"]  # allow unused arguments and assert in tests
"alembic/versions/*.py" = ["E501", "F401", "F841"]  # allow long lines, unused imports in migrations
"src/main.py" = ["E402"]  # FastAPI pattern: import routes after app creation

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
