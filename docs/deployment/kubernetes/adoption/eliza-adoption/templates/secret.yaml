{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eliza.fullname" . }}-secrets
  labels:
    {{- include "eliza.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- if .Values.postgresql.external.enabled }}
  DB_PASSWORD: {{ .Values.postgresql.external.password | quote }}
  {{- else }}
  DB_PASSWORD: {{ default "eliza-default-password" .Values.postgresql.internal.password | quote }}
  {{- end }}
{{- end }}
