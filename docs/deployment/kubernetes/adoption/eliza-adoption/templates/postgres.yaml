{{- if .Values.postgresql.internal.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "eliza.fullname" . }}-postgres
  labels:
    {{- include "eliza.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "eliza.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "eliza.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "eliza.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.internal.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "ai_enablement"
            - name: POSTGRES_USER
              value: "eliza"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eliza.secretName" . }}
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "eliza", "-d", "ai_enablement"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "eliza", "-d", "ai_enablement"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgresql.internal.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgresql.internal.storageClass }}
        storageClassName: {{ .Values.postgresql.internal.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.internal.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eliza.fullname" . }}-postgres
  labels:
    {{- include "eliza.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    {{- include "eliza.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
