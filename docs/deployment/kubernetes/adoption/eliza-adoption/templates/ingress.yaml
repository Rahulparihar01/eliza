{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "eliza.fullname" . }}
  labels:
    {{- include "eliza.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # API routes go to the app backend
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "eliza.fullname" $ }}-app
                port:
                  number: {{ $.Values.service.appPort }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "eliza.fullname" $ }}-app
                port:
                  number: {{ $.Values.service.appPort }}
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "eliza.fullname" $ }}-app
                port:
                  number: {{ $.Values.service.appPort }}
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: {{ include "eliza.fullname" $ }}-app
                port:
                  number: {{ $.Values.service.appPort }}
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: {{ include "eliza.fullname" $ }}-app
                port:
                  number: {{ $.Values.service.appPort }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "eliza.fullname" $ }}-app
                port:
                  number: {{ $.Values.service.appPort }}
          # Everything else goes to the frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "eliza.fullname" $ }}-frontend
                port:
                  number: {{ $.Values.service.frontendPort }}
    {{- end }}
{{- end }}
