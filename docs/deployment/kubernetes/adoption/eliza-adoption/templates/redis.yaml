{{- if .Values.redis.internal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eliza.fullname" . }}-redis
  labels:
    {{- include "eliza.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "eliza.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "eliza.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.internal.image }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.internal.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eliza.fullname" . }}-redis
  labels:
    {{- include "eliza.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    {{- include "eliza.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
